name: build

# 推 main / PR 只出构建产物；推 v* 标签才创建 GitHub Release。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 校验脚本、JSON 与面板 JS
        run: |
          sh -n build.sh
          for f in tools/*.sh; do sh -n "$f"; done
          python3 -m json.tool config/config.example.json >/dev/null
          python3 - <<'PY'
          import re
          s = open('assets/web/index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, re.S)
          if not blocks:
              raise SystemExit('面板没有内联脚本')
          open('/tmp/panel.js', 'w', encoding='utf-8').write(blocks[0])
          PY
          node --check /tmp/panel.js

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK"
            exit 1
          fi
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | head -1)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_PLATFORM=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$SDK/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: 还原签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/phonebox.jks
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用临时签名，不能覆盖安装已发布版本"
          fi

      - name: 检查 tag 与版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | head -1 | cut -d'"' -f2)
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 AndroidManifest versionName $VER 不一致"
            exit 1
          fi
          if [ "${{ steps.signing.outputs.signed }}" != "1" ]; then
            echo "::warning::tag 构建缺少签名密钥，只上传产物，不创建 Release"
          fi

      - name: 构建 APK
        env:
          KEYSTORE: keystore/phonebox.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          sh build.sh
          (cd dist && sha256sum ./*.apk > SHA256SUMS)

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: phonebox-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/latest.json
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          FILES="dist/com.zhoufla.phonebox-*.apk dist/SHA256SUMS dist/latest.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "PhoneBox $TAG" --generate-notes
          fi

      - name: 写入构建摘要
        run: |
          {
            echo "### PhoneBox ${{ github.ref_name }}"
            echo '```json'
            cat dist/latest.json
            echo '```'
            if [ "${{ steps.signing.outputs.signed }}" = "1" ]; then
              echo "签名：仓库密钥"
            else
              echo "签名：临时密钥（未配置 KEYSTORE_BASE64）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
