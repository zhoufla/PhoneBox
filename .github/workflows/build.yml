name: build

# 推 main / PR 默认只出构建产物；推 v* 标签或手动选择“发布 Release”才发布。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: 构建 APK，或发布正式 Release
        type: choice
        options:
          - build
          - release
        default: build
        required: true
      release_tag:
        description: 可选；留空时自动使用 Manifest 版本，例如 v0.8.0
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 校验脚本、JSON 与面板 JS
        run: |
          sh -n build.sh
          for f in tools/*.sh; do sh -n "$f"; done
          python3 -m json.tool config/config.example.json >/dev/null
          python3 -m json.tool assets/web/manifest.webmanifest >/dev/null
          python3 - <<'PY'
          import re
          s = open('assets/web/index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, re.S)
          if not blocks:
              raise SystemExit('面板没有内联脚本')
          open('/tmp/panel.js', 'w', encoding='utf-8').write(blocks[0])
          PY
          node --check /tmp/panel.js

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK"
            exit 1
          fi
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | head -1)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_PLATFORM=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$SDK/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: 还原签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/phonebox.jks
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用临时签名，不能覆盖安装已发布版本"
          fi

      - name: 检查发布版本与签名
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.action == 'release')
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) TAG="$GITHUB_REF_NAME" ;;
            *) TAG="$RELEASE_TAG_INPUT" ;;
          esac
          VER=$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | head -1 | cut -d'"' -f2)
          if [ -z "$TAG" ]; then
            TAG="v$VER"
            echo "未填写标签，使用 Manifest 版本：$TAG"
          fi
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::标签 $TAG 与 AndroidManifest versionName $VER 不一致"
            exit 1
          fi
          if [ "$SIGNED" != "1" ]; then
            echo "::error::正式 Release 必须配置 KEYSTORE_BASE64，并使用手机当前安装版的签名密钥"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: 构建 APK
        env:
          KEYSTORE: keystore/phonebox.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          sh build.sh
          (cd dist && sha256sum ./*.apk > SHA256SUMS)

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: phonebox-${{ steps.release_meta.outputs.tag || inputs.release_tag || github.ref_name }}-${{ github.sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/latest.json
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: steps.release_meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          FILES="dist/com.zhoufla.phonebox-*.apk dist/SHA256SUMS dist/latest.json"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" $FILES --clobber
          else
            gh release create "$RELEASE_TAG" $FILES --title "PhoneBox $RELEASE_TAG" \
              --generate-notes --target "$GITHUB_SHA"
          fi

      - name: 写入构建摘要
        run: |
          {
            echo "### PhoneBox ${{ steps.release_meta.outputs.tag || inputs.release_tag || github.ref_name }}"
            echo '```json'
            cat dist/latest.json
            echo '```'
            if [ "${{ steps.signing.outputs.signed }}" = "1" ]; then
              echo "签名：仓库密钥"
            else
              echo "签名：临时密钥（未配置 KEYSTORE_BASE64）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: 清理旧 CI 与 Release（保留最近 3 个）
    needs: apk
    if: needs.apk.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: 删除较旧的 Actions 运行与关联 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_IDS=$(gh api --paginate --jq '.workflow_runs[].id' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?per_page=100")
          KEPT=1
          for RUN_ID in $RUN_IDS; do
            if [ "$RUN_ID" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            if [ "$KEPT" -lt 3 ]; then
              KEPT=$((KEPT + 1))
              continue
            fi
            echo "删除旧 Actions run: $RUN_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          done

      - name: 只保留最近 3 个 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_IDS=$(gh api --paginate --jq '.[].id' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          KEPT=0
          for RELEASE_ID in $RELEASE_IDS; do
            if [ "$KEPT" -lt 3 ]; then
              KEPT=$((KEPT + 1))
              continue
            fi
            echo "删除旧 GitHub Release: $RELEASE_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          done
